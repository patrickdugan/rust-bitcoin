[package]
name = "bitcoin-zk-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "Prove Raito's client program on rust-bitcoin blocks and time each stage"
license = "CC0-1.0"
publish = false

[[bin]]
name = "zk-bench"
path = "src/main.rs"

[dependencies]
bitcoin = { path = "../../../bitcoin", default-features = false, features = ["std"] }
bitcoin-zk-args = { workspace = true }
stwo = { workspace = true }
cairo-air = { workspace = true }
stwo_cairo_prover = { workspace = true }
stwo-cairo-adapter = { workspace = true }
cairo-program-runner-lib = { workspace = true }
cairo-vm = { workspace = true }
cairo-lang-executable = { workspace = true }
cairo-lang-execute-utils = { workspace = true }
cairo-lang-runner = { workspace = true }
serde_json = { workspace = true }
num-bigint = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# parking_lot_core only parks threads with WASM atomics behind its `nightly` feature;
# without it, every lock contention on wasm32-wasip1-threads panics. The prover
# already needs nightly.
[target.'cfg(target_family = "wasm")'.dependencies]
parking_lot_core = { version = "0.9", features = ["nightly"] }
